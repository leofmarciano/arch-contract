name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@leofmarciano'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r test

      # Guard against tag/manifest drift (see publish-npm.yml).
      - name: Verify package.json version matches the release tag
        if: github.event_name == 'release'
        working-directory: packages/arch-contract
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  release tag=$TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release tag ($TAG). Bump the version (package.json + src/index.ts + CHANGELOG) before tagging."
            exit 1
          fi

      # GitHub Packages requires the package name to be scoped to the owner.
      - name: Scope package name for GitHub Packages
        working-directory: packages/arch-contract
        run: npm pkg set name="@leofmarciano/arch-contract"

      - name: Publish to GitHub Packages
        working-directory: packages/arch-contract
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
