name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r test

      # Guard against tag/manifest drift: the workflow publishes package.json
      # verbatim, so a release tagged vX.Y.Z whose commit still carries an older
      # version would silently re-publish the old version (and 403). Fail loudly.
      - name: Verify package.json version matches the release tag
        if: github.event_name == 'release'
        working-directory: packages/arch-contract
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  release tag=$TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release tag ($TAG). Bump the version (package.json + src/index.ts + CHANGELOG) before tagging."
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/arch-contract
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
