name: Bug report
description: Report incorrect behavior in ArchContract
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the violation(s) you got (or didn't get) but expected.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant arch-contract.yaml
      description: The (minimal) config that reproduces the issue.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps or a minimal repo/snippet of source that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ArchContract version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node 22.x, pnpm 10.x, macOS 15
    validations:
      required: true
